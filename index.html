<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="theme-color" id="meta-theme-color" content="#F5F3EE">
  <meta name="theme-color" content="#131312" media="(prefers-color-scheme: dark)">
  <meta name="description" content="LIFE OS - Sistema operativo personal, local y privado">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LIFE OS">
  <title>LIFE OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.svg">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>

            <span class="brand-mark" aria-hidden="true">LO</span>

        </div>
        <nav class="nav" id="desktop-nav">

            <ul class="nav-list">

        <div id="module-root" class="module-root"></div>
